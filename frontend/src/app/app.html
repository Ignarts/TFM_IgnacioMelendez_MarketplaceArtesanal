<nav>
  <a routerLink="/" class="brand" aria-label="Marketplace Artesanal">
    <svg lucideCompass></svg>
    <span>Marketplace Artesanal</span>
  </a>
  <a routerLink="/carrito" class="nav-item nav-right-start" aria-label="Carrito">
    <span class="icon-wrap">
      <svg lucideShoppingCart></svg>
      @if (cart.count() > 0) { <span class="cart-count">{{ cart.count() }}</span> }
    </span>
    <span class="nav-label">Carrito</span>
  </a>
  @if (auth.isLoggedIn()) {
    <a routerLink="/favoritos" class="nav-item" aria-label="Favoritos">
      <svg lucideHeart></svg>
      <span class="nav-label">Favoritos</span>
    </a>
    <a routerLink="/pedidos" class="nav-item" aria-label="Mis pedidos">
      <svg lucidePackage></svg>
      <span class="nav-label">Pedidos</span>
    </a>
    <a routerLink="/profile" class="nav-item" aria-label="Perfil">
      <svg lucideCircleUser></svg>
      <span class="nav-label">Perfil</span>
    </a>
    @if (isSeller()) {
      <a routerLink="/mi-tienda" class="nav-item" aria-label="Mi tienda">
        <svg lucideStore></svg>
        <span class="nav-label">Mi tienda</span>
      </a>
      <a routerLink="/mis-ventas" class="nav-item" aria-label="Mis ventas">
        <svg lucideChartColumn></svg>
        <span class="nav-label">Mis ventas</span>
      </a>
    } @else {
      <a routerLink="/vender" class="nav-item" aria-label="Vender">
        <svg lucideStore></svg>
        <span class="nav-label">Vender</span>
      </a>
    }
    @if (isAdmin()) {
      <a routerLink="/admin" class="nav-item" aria-label="Admin">
        <svg lucideShieldCheck></svg>
        <span class="nav-label">Admin</span>
      </a>
    }
    <button type="button" (click)="logout()" class="nav-item" aria-label="Cerrar sesión">
      <svg lucideLogOut></svg>
      <span class="nav-label">Salir</span>
    </button>
  } @else {
    <a routerLink="/login" class="nav-item" aria-label="Login">
      <svg lucideLogIn></svg>
      <span class="nav-label">Login</span>
    </a>
    <a routerLink="/register" class="nav-item" aria-label="Registro">
      <svg lucideUserPlus></svg>
      <span class="nav-label">Registro</span>
    </a>
  }
</nav>
<main>
  <router-outlet />
</main>
