services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_NAME:-marketplace}
      MYSQL_USER: ${DB_USER:-marketplace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketplace}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD:-marketplace}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Set APP_SEED_DEMO=true to load fake shops/products on startup (demo only).
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
    ports:
      - "8080:8080"

  # Lightweight web UI to inspect the database at http://localhost:8082
  adminer:
    image: adminer:4
    depends_on:
      - mysql
    ports:
      - "8082:8080"

volumes:
  mysql-data:
